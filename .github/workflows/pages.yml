name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      from:
        description: "Начальная дата YYYY-MM-DD (пусто = вчера по МСК)"
        required: false
        type: string
      to:
        description: "Конечная дата YYYY-MM-DD (пусто = начальная дата)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update yesterday in secure storage
        if: github.event_name != 'push'
        env:
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
        run: |
          FROM="${DATE_FROM:-$(TZ=Europe/Moscow date -d yesterday +%F)}"
          TO="${DATE_TO:-$FROM}"
          curl --fail-with-body --silent --show-error \
            -X POST "https://wqxbnwcdkobgeyhdmqup.supabase.co/functions/v1/revenue-api" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            --data "{\"from\":\"$FROM\",\"to\":\"$TO\"}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
